# Manda una notificación a su teléfono cuando le dedicas una canción.
name: Avisos de canciones nuevas
on:
  push:
    branches: [main]
    paths: ["songs/songs.json", "push/test.json"]
  schedule:
    - cron: "5 14 * * *"   # 8:05 a. m. en Ciudad de México: canciones programadas para ese día
  workflow_dispatch:
permissions:
  contents: write
concurrency: avisos
jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock web-push@3
      - run: node .github/scripts/avisos.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          EVENT: ${{ github.event_name }}
          APP_NAME: Anahí
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
